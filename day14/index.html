<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
    <header class="navbar">
    <h1>Habesha Eatery</h1>
    <nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Contact</a>
    </nav>
    </header>

    <section class="welcome">
    <h2>Welcome to Habesha Eatery</h2>
    <p>Traditional Ethiopian Food</p>
    </section>

    <section class="menu">
    <div class="card">
    <span class="badge">Popular</span>
    <img src="images/kitfo.jpg" alt="Kitfo">
    <h3>Kitfo</h3>
    <p>Fresh minced beef with Ethiopian spices.</p>
    <h4>850 Birr</h4>
    </div>

    <div class="card">
    <img src="images/tibs.jpg" alt="Tibs">
    <h3>Tibs</h3>
    <p>Grilled beef with onions and peppers.</p>
    <h4>800 Birr</h4>
    </div>

    <div class="card">
    <img src="images/dorowat.jpg" alt="Doro">
    <h3>Doro Wat</h3>
    <p>Delicious chicken stew with Egg.</p>
    <h4>950 Birr</h4>
    </div>
    </section>

    <footer>
    <p>📍 Bole, Addis Ababa</p>
    </footer>
</div>
</body>
</html>
