<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Contact - Habesha Eatery, Bole</title>
    <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa.">
</head>
<body>
<header><h1>Contact Habesha Eatery</h1></header>
<nav aria-label="Main Navigation">
    <a href="index.html">Reservations</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
<section>
<h2>Send us a Message</h2>
<form action="/contact" method="post">
<label for="name">Name</label>
<input id="name" name="name" type="text" required>
<label for="email">Email</label>
<input id="email" name="email" type="email" required>
<label for="message">Message</label>
<textarea id="message" name="message" rows="5" required> </textarea>
<button type="submit">Send Message</button>
</form>
</section>
</main>
<footer>
<address>Bole, Addis Ababa</address>
</footer>
</body>
</html>
